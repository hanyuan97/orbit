<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 356" role="img" aria-labelledby="title desc">
  <title id="title">Orbit architecture</title>
  <desc id="desc">CLI and Dashboard connect to a single daemon. The daemon manages containers and host processes.</desc>
  <style>
    .canvas { fill: #f6f8fa; }
    .node { fill: #ffffff; stroke: #d0d7de; }
    .label { fill: #1f2328; }
    .detail { fill: #59636e; }
    .connector { stroke: #0969da; }
    .arrowhead { fill: #0969da; }
    .edge-label { font-size: 17px; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #161b22; }
      .node { fill: #1c2128; stroke: #30363d; }
      .label { fill: #e6edf3; }
      .detail { fill: #a4aeba; }
      .connector { stroke: #58a6ff; }
      .arrowhead { fill: #58a6ff; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5Z" class="arrowhead"/></marker></defs>
  <rect width="720" height="356" rx="16" class="canvas"/>
  <g font-family="system-ui, sans-serif">
    <rect x="48" y="20" width="240" height="57" rx="10" class="node"/>
    <text x="168.0" y="44" text-anchor="middle" font-size="21" font-weight="600" class="label">CLI</text>
    <text x="168.0" y="64" text-anchor="middle" font-size="16" font-weight="400" class="detail">HTTP over Unix socket</text>
    <rect x="432" y="20" width="240" height="57" rx="10" class="node"/>
    <text x="552.0" y="44" text-anchor="middle" font-size="21" font-weight="600" class="label">Dashboard</text>
    <text x="552.0" y="64" text-anchor="middle" font-size="16" font-weight="400" class="detail">HTTP and SSE</text>
    <path d="M168 83V112H253V139" fill="none" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M552 83V112H467V139" fill="none" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="173" y="145" width="374" height="102" rx="10" class="node"/>
    <text x="360" y="175" text-anchor="middle" font-size="21" font-weight="600" class="label">Orbit daemon</text>
    <text x="360" y="206" text-anchor="middle" font-size="19" font-weight="500" class="detail">HTTP API ↔ Orchestrator</text>
    <text x="360" y="230" text-anchor="middle" font-size="16" font-weight="400" class="detail">Event loop and state machine</text>
    <path d="M253 253V270H168V286" fill="none" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M467 253V270H552V286" fill="none" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="48" y="292" width="240" height="57" rx="10" class="node"/>
    <text x="168.0" y="316" text-anchor="middle" font-size="21" font-weight="600" class="label">Containers</text>
    <text x="168.0" y="336" text-anchor="middle" font-size="16" font-weight="400" class="detail">Docker SDK</text>
    <rect x="432" y="292" width="240" height="57" rx="10" class="node"/>
    <text x="552.0" y="316" text-anchor="middle" font-size="21" font-weight="600" class="label">Dev processes</text>
    <text x="552.0" y="336" text-anchor="middle" font-size="16" font-weight="400" class="detail">Process groups</text>
  </g>
</svg>
