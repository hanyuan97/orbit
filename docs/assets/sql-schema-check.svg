<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 218" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to check the local schema</title>
  <desc id="desc">Orbit diff can check recorded state and report changed files. DeployReport compares a DACPAC with the database and lists planned changes.</desc>
  <style>
    .canvas { fill: #f6f8fa; }
    .node { fill: #ffffff; stroke: #d0d7de; }
    .label { fill: #1f2328; }
    .detail { fill: #59636e; }
    .connector { stroke: #0969da; }
    .arrowhead { fill: #0969da; }
    @media (max-width: 440px) {
      .label { font-size: 24px; transform: translateY(10px); }
      .detail { display: none; }
    }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #161b22; }
      .node { fill: #1c2128; stroke: #30363d; }
      .label { fill: #e6edf3; }
      .detail { fill: #a4aeba; }
      .connector { stroke: #58a6ff; }
      .arrowhead { fill: #58a6ff; }
    }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5Z" class="arrowhead"/></marker></defs>
  <rect width="720" height="218" rx="16" class="canvas"/>
  <rect x="20" y="25" width="200" height="65" rx="9" class="node"/>
  <text x="120" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">Orbit diff</text>
  <text x="120" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">Quick check</text>
  <rect x="260" y="25" width="200" height="65" rx="9" class="node"/>
  <text x="360" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">Recorded state</text>
  <text x="360" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">Source files and DB markers</text>
  <rect x="500" y="25" width="200" height="65" rx="9" class="node"/>
  <text x="600" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">Quick result</text>
  <text x="600" y="74" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">In sync, files, or cached result</text>
  <path d="M226 57H253" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M466 57H493" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="20" y="126" width="200" height="65" rx="9" class="node"/>
  <text x="120" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">SQL Project</text>
  <text x="120" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">Build or reuse a DACPAC</text>
  <rect x="260" y="126" width="200" height="65" rx="9" class="node"/>
  <text x="360" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">DeployReport</text>
  <text x="360" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">Compare with the local DB</text>
  <rect x="500" y="126" width="200" height="65" rx="9" class="node"/>
  <text x="600" y="153" text-anchor="middle" font-family="system-ui,sans-serif" font-size="19" font-weight="600" class="label">Object changes</text>
  <text x="600" y="175" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" class="detail">Planned creates, alters, drops</text>
  <path d="M226 158H253" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M466 158H493" class="connector" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
